<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pixora AI — 4K Upscaler</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-[#0b0f19] text-gray-100 min-h-screen flex flex-col">
  
  <header class="glass border-b border-gray-800 p-4">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <a href="index.html" class="text-xl font-bold text-white">Pixora<span class="text-purple-400">.AI</span></a>
      <a href="index.html" class="text-xs bg-gray-800 px-3 py-1.5 rounded-lg hover:bg-gray-700">← Back to Studio</a>
    </div>
  </header>

  <main class="max-w-4xl mx-auto p-6 flex-1 w-full">
    <h1 class="text-3xl font-extrabold text-white text-center mb-2">4K Super-Resolution Upscaler</h1>
    <p class="text-gray-400 text-sm text-center mb-8">Enhance low-resolution graphics to ultra-sharp 4K fidelity.</p>

    <div class="glass p-8 rounded-3xl border border-gray-800 text-center">
      <div class="flex justify-center gap-4 mb-6">
        <button class="px-4 py-2 rounded-xl text-xs font-semibold bg-purple-600 text-white">2x Scale</button>
        <button class="px-4 py-2 rounded-xl text-xs font-semibold glass text-gray-300">4x Ultra Scale</button>
      </div>

      <div class="border-2 border-dashed border-gray-700 rounded-2xl p-12 cursor-pointer hover:border-indigo-500 transition">
        <i class="fa-solid fa-maximize text-4xl text-indigo-400 mb-3"></i>
        <p class="text-sm font-semibold text-gray-300">Select Image to Upscale</p>
      </div>
    </div>
  </main>
</body>
</html>
