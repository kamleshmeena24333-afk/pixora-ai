<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pixora AI — Background Remover</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-[#0b0f19] text-gray-100 min-h-screen flex flex-col">
  
  <header class="glass border-b border-gray-800 p-4">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <a href="index.html" class="text-xl font-bold text-white">Pixora<span class="text-purple-400">.AI</span></a>
      <a href="index.html" class="text-xs bg-gray-800 px-3 py-1.5 rounded-lg hover:bg-gray-700">← Back to Studio</a>
    </div>
  </header>

  <main class="max-w-4xl mx-auto p-6 flex-1 w-full">
    <h1 class="text-3xl font-extrabold text-white text-center mb-2">AI Background Remover</h1>
    <p class="text-gray-400 text-sm text-center mb-8">Upload any image to isolate the subject instantly.</p>

    <div class="glass p-8 rounded-3xl border border-gray-800 text-center">
      <input type="file" id="upload-input" accept="image/*" class="hidden" onchange="previewUpload(event)" />
      
      <div id="drop-zone" onclick="document.getElementById('upload-input').click()" class="border-2 border-dashed border-gray-700 hover:border-purple-500 rounded-2xl p-10 cursor-pointer transition">
        <i class="fa-solid fa-cloud-arrow-up text-4xl text-purple-400 mb-3"></i>
        <p class="text-sm font-semibold text-gray-300">Click or Drag & Drop Image Here</p>
        <p class="text-xs text-gray-500 mt-1">PNG, JPG, WebP up to 10MB</p>
      </div>

      <div id="preview-area" class="hidden mt-6 flex flex-col sm:flex-row gap-4 items-center justify-center">
        <div class="w-64 h-64 rounded-xl overflow-hidden glass border border-gray-700">
          <img id="orig-img" class="w-full h-full object-cover" />
        </div>
        <div class="text-2xl text-purple-400"><i class="fa-solid fa-arrow-right"></i></div>
        <div class="w-64 h-64 rounded-xl overflow-hidden bg-[radial-gradient(#2e384d_1px,transparent_1px)] [background-size:16px_16px] border border-gray-700 flex items-center justify-center">
          <img id="result-img" class="w-full h-full object-contain hidden" />
          <span id="proc-loader" class="text-xs text-purple-400">Processing...</span>
        </div>
      </div>
    </div>
  </main>

  <script>
    function previewUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      
      document.getElementById('drop-zone').classList.add('hidden');
      document.getElementById('preview-area').classList.remove('hidden');
      
      const orig = document.getElementById('orig-img');
      orig.src = URL.createObjectURL(file);
      
      // Simulate Processing
      setTimeout(() => {
        document.getElementById('proc-loader').classList.add('hidden');
        const res = document.getElementById('result-img');
        res.src = orig.src; // For demo / Connected with Rembg API in backend
        res.classList.remove('hidden');
      }, 1500);
    }
  </script>
</body>
</html>
